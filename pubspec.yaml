name: coreflame
description: A polished 2D game template built with Flutter and Flame.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.9
  flame: ^1.38.2
  flame_audio: ^2.12.2
  flame_svg: ^1.12.2
  flutter:
    sdk: flutter
  pulsar_haptics: ^0.1.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/audio/
    - assets/icons/
  fonts:
    - family: Gluten
      fonts:
        - asset: assets/fonts/gluten_variable.ttf
  uses-material-design: true
