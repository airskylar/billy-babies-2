name: coreflame
description: A polished 2D game template built with Flutter and Flame.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.9
  flame: ^1.38.2
  flame_audio: ^2.12.2
  flame_svg: ^1.12.2
  flutter:
    sdk: flutter
  games_services: ^5.3.0
  in_app_review: ^2.0.12
  json_annotation: ^4.12.0
  pulsar_haptics: ^0.1.1
  shared_preferences: ^2.5.5
  state_launcher_flutter:
    git:
      url: https://github.com/aleclarson/state_launcher_flutter.git
      ref: 77b9a41c4f4fc8f213c6d48e5fc6bee8187a4013

dev_dependencies:
  build_runner: ^2.15.1
  flame_test: ^2.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  vm_service: ^15.3.0

flutter:
  assets:
    - assets/audio/
    - assets/icons/
  fonts:
    - family: Gluten
      fonts:
        - asset: assets/fonts/gluten_variable.ttf
  uses-material-design: true
